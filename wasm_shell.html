<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word War vi</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #d8d8d8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.08em;
      color: #7fff7f;
      font-weight: 600;
    }
    #status-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-height: 1.2em;
      font-size: 0.85rem;
      color: #9e9e9e;
    }
    #status-bar[hidden] {
      display: none;
    }
    progress {
      width: 260px;
      height: 10px;
      accent-color: #4caf50;
    }
    .canvas-frame {
      border: 1px solid #2e4d2e;
      background: #000;
      line-height: 0;
      box-shadow: 0 0 24px rgba(0, 180, 60, 0.12);
    }
    /* No border or padding on #canvas itself so SDL mouse coords stay exact. */
    #canvas {
      display: block;
      border: 0;
      padding: 0;
      margin: 0;
      background: #000;
      outline: none;
      max-width: 100%;
    }
    #canvas:fullscreen {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }
    button {
      background: #102010;
      color: #9eff9e;
      border: 1px solid #3c7a3c;
      padding: 5px 12px;
      font: inherit;
      cursor: pointer;
    }
    button:hover {
      background: #193319;
    }
    .hint {
      color: #8f8f8f;
      font-size: 0.8rem;
    }
    .controls {
      max-width: 820px;
      text-align: center;
      font-size: 0.8rem;
      line-height: 1.6;
      color: #a8a8a8;
    }
    .controls kbd {
      background: #141414;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 1px 5px;
      color: #e6e6e6;
      font: inherit;
    }
  </style>
</head>
<body>
  <h1>WORD WAR VI</h1>

  <div id="status-bar">
    <div id="status">Downloading...</div>
    <progress id="progress" value="0" max="100" hidden></progress>
  </div>

  <div class="canvas-frame">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  </div>

  <div class="toolbar">
    <button type="button" id="fullscreen-btn">Fullscreen</button>
    <span class="hint">Click the game screen to focus keyboard input. Audio unlocks on first click or key press.</span>
  </div>

  <div class="controls">
    <kbd>q</kbd> Insert Quarter &middot;
    <kbd>h</kbd>/<kbd>j</kbd>/<kbd>k</kbd>/<kbd>l</kbd> or Arrows: Move &middot;
    <kbd>z</kbd>/<kbd>Space</kbd>: Laser &middot;
    <kbd>b</kbd>: Bomb &middot;
    <kbd>g</kbd>: Gravity Bomb &middot;
    <kbd>c</kbd>: Chaff &middot;
    <kbd>x</kbd>: Thrust &middot;
    <kbd>p</kbd>: Pause &middot;
    <kbd>F1</kbd>: Help &middot;
    <kbd>m</kbd>: Music &middot;
    <kbd>s</kbd>: SFX &middot;
    <kbd>Esc</kbd>: Quit
  </div>

  <script type="text/javascript">
    var statusBarElement = document.getElementById('status-bar');
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var canvasElement = document.getElementById('canvas');
    var fullscreenButton = document.getElementById('fullscreen-btn');

    canvasElement.addEventListener('click', function() {
      canvasElement.focus();
    });

    canvasElement.addEventListener('webglcontextlost', function(e) {
      alert('WebGL context lost. You will need to reload the page.');
      e.preventDefault();
    }, false);

    fullscreenButton.addEventListener('click', function() {
      canvasElement.focus();
      if (canvasElement.requestFullscreen) {
        canvasElement.requestFullscreen();
      }
    });

    window.addEventListener('keydown', function(e) {
      var code = e.code || e.key;
      if (code === 'ArrowUp' || code === 'ArrowDown' ||
          code === 'ArrowLeft' || code === 'ArrowRight' ||
          code === 'Space' || code === ' ' || code === 'F1') {
        e.preventDefault();
      }
    }, false);

    var Module = {
      print: function() {
        var text = Array.prototype.slice.call(arguments).join(' ');
        console.log(text);
      },
      printErr: function() {
        var text = Array.prototype.slice.call(arguments).join(' ');
        console.error(text);
      },
      canvas: canvasElement,
      setStatus: function(text) {
        if (!Module.setStatus.last) {
          Module.setStatus.last = { time: Date.now(), text: '' };
        }
        if (text === Module.setStatus.last.text) {
          return;
        }
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) {
          return;
        }
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2], 10) * 100;
          progressElement.max = parseInt(m[4], 10) * 100;
          progressElement.hidden = false;
          statusBarElement.hidden = false;
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          statusBarElement.hidden = !text;
        }
        statusElement.textContent = text;
        if (!text) {
          canvasElement.focus();
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
  </script>
  {{{ SCRIPT }}}
</body>
</html>
